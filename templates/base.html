<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Shop</title>
</head>
<body>
    <a href="{% url 'index' %}">
        <h1>La boutique de Daniel</h1>
    </a>
    
    {% if user.is_authenticated %}
        {{ user.username }}
        <a href="{% url 'logout' %}">Se déconnecter</a>
        {% if user.cart %}
            <p>
                <a href="{% url 'cart' %}">Voir mon panier : {{ user.cart.orders.count }}</a>
            </p>
        {% endif %}    
    {% else %}
        <a href="{% url 'signup' %}">S'inscrire</a>
        <a href="{% url 'login' %}">Se connecter</a>
    {% endif %}
    
    {% block content %}
    {% endblock %}
</body>
</html>
