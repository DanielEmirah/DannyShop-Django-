{% extends 'base.html' %}


{% block content %}

{% for product in products %}
<a href="{% url 'details' product.slug %}" style="text-decoration: none; color: inherit;">
    <h2>{{ product.name }}</h2>
    <img src="{{ product.thumbnail.url }}" alt="{{ product.name }}", style="max-width: 250px;">
</a>
<a href="{% url 'details' product.slug %}">Voir l'article</a>
{% endfor %}

{% endblock %}
